<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AI Video Highlight</title>
    <style>
        /* Reuse all the styles from the login page code above */
        /* ... Copy and Paste the entire <style> block from login.html here ... */
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> </head>
<body style="margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #050505; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;">
    
    <div style="position: absolute; width: 100%; height: 100%; z-index: -1; overflow: hidden;">
        <div style="position: absolute; width: 500px; height: 500px; background: linear-gradient(45deg, #7928ca, #ff0080); filter: blur(100px); border-radius: 50%; opacity: 0.6;"></div>
    </div>

    <div class="glass-card" style="background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px; padding: 50px 40px; width: 380px; text-align: center; color: white;">
        <h2 style="color: #00f2fe; text-shadow: 0 0 10px #00f2fe;">Join Access</h2>
        <p style="color: #888;">Create your creator credentials</p>
        
        <form action="/register" method="POST">
            <div style="margin-bottom: 20px;">
                <input type="text" name="username" placeholder="Create Username" required style="width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; outline: none; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 20px;">
                <input type="password" name="password" placeholder="Create Password" required style="width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; outline: none; box-sizing: border-box;">
            </div>
            <button type="submit" style="width: 100%; padding: 14px; background: linear-gradient(to right, #00f2fe, #4facfe); border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase;">Initialize Account</button>
        </form>
        
        <a href="/login" style="margin-top: 25px; display: block; color: #666; text-decoration: none; font-size: 0.85em;">Already a member? <span style="color: #00f2fe;">Login</span></a>
    </div>
</body>
</html>
